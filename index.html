<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEXORA Engine</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        font-family: Arial, sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #canvas-root {
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        left: 18px;
        top: 18px;
        z-index: 10;
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 12px 14px;
        color: white;
        font-size: 14px;
        line-height: 1.5;
        backdrop-filter: blur(4px);
      }

      .hud strong {
        color: #38bdf8;
      }

      .controls {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 10;
        background: rgba(2, 6, 23, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 10px 14px;
        color: #dbeafe;
        font-size: 12px;
        line-height: 1.7;
      }

      .controls strong {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-root"></div>

      <div class="hud">
        <div><strong>VEXORA</strong> Engine Test</div>
        <div id="fps">FPS: 60</div>
        <div id="position">Position: 0, 0, 0</div>
      </div>

      <div class="controls">
        <div><strong>Controls</strong></div>
        <div>W / A / S / D = Move</div>
        <div>Space = Jump</div>
        <div>Mouse = Look around</div>
      </div>
    </div>

    <script type="module" src="/src/engine/main.ts"></script>
  </body>
</html>
